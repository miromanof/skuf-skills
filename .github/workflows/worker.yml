name: Deploy Cloudflare API

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_D1_DATABASE_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Prepare production D1 binding
        run: node scripts/prepare-cloudflare-config.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config apps/worker/wrangler.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config apps/worker/wrangler.jsonc
      - name: Verify API health
        run: curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 https://api.skufskills.ru/health
